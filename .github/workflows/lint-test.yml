name: Lint y Tests

# Se ejecuta en cada push y pull request. Corre flake8 sobre el notebook
# (vía nbqa) y pytest sobre enigma_diversity/ — incluye la prueba de
# regresión del bug de Chao1 encontrado y corregido en este proyecto.
on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install nbqa flake8

      - name: flake8 sobre el notebook (vía nbqa)
        run: |
          python -m nbqa flake8 analisis_diversidad_microbiana_ENIGMA.ipynb --extend-ignore=E402,E501

      - name: pytest
        run: pytest -q
